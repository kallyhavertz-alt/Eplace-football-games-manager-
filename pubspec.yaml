name: eplace
description: "pes manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  google_sign_in: ^7.2.0
  http: ^1.6.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.0.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_messaging: ^16.4.3
  image_picker: ^1.2.4

  flutter_local_notifications: ^22.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/eplace_logo.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/eplace_logo.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/eplace_background.png
    - assets/eplace.png
    - assets/eplace_logo.png
    - assets/screens.png
    - assets/league.png
